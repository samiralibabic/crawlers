version: '3.8'

services:
  crawler:
    build: .
    environment:
      - STRIPE_SECRET_KEY
      - SECRET_KEY
    ports:
      - "5001:5001"
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
    # The slim Python image has no curl or wget, so probe with Python. urlopen raises on 4xx/5xx.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
